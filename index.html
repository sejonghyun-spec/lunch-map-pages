<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>막냉이 합정 점심 뭐먹지</title>
<link rel="preconnect" href="https://dapi.kakao.com" crossorigin>
<style>
:root{
  --brand:#9a4f31;--brand-dark:#74361f;--text:#211d1a;--muted:#77706b;
  --line:#e8e2dc;--soft:#f7f4f1;--panel:#fff;--shadow:0 8px 24px rgba(34,27,22,.12);
  --sidebar:370px;--header:68px;
}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;color:var(--text);background:#fff}
body{overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:var(--header) 1fr}

/* header */
.topbar{display:grid;grid-template-columns:var(--sidebar) 1fr auto;align-items:center;background:#fff;border-bottom:1px solid var(--line);z-index:40}
.brand{height:100%;display:flex;align-items:center;padding:0 18px;border-right:1px solid var(--line)}
.brand-title{font-size:22px;font-weight:900;letter-spacing:-.5px}.brand-sub{font-size:12px;color:var(--muted);margin-top:4px}
.top-filters{display:flex;align-items:center;gap:7px;padding:0 14px;overflow-x:auto;scrollbar-width:none}.top-filters::-webkit-scrollbar{display:none}
.filter-btn{flex:0 0 auto;border:1px solid #ded7d1;background:#fff;color:#4b4540;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:800;cursor:pointer;transition:.14s
.filter-btn:hover{transform:translateY(-1px);border-color:#cbb9ae}.filter-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.header-count{margin-right:16px;padding:7px 11px;border-radius:999px;background:#f4e8e2;color:var(--brand-dark);font-size:13px;font-weight:900;white-space:nowrap

/* main */
.main{min-height:0;display:grid;grid-template-columns:var(--sidebar) 1fr}
.sidebar{min-height:0;background:#fff;border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto 1fr;z-index:20;box-shadow:5px 0 18px rgba(36,30,25,.06)}
.search-wrap{padding:12px 14px 10px}.search{width:100%;height:42px;border:1px solid #ddd6d0;border-radius:12px;padding:0 14px;font-size:14px;background:#fff;outline:none
.search:focus{border-color:#bd8c77;box-shadow:0 0 0 3px rgba(154,79,49,.08)}
.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 10px}
.quick-btn{height:38px;border:1px solid #dfd9d4;border-radius:11px;background:#fff;font-size:13px;font-weight:800;color:#4d4742;cursor:pointer
.quick-btn:hover{background:#faf7f5}.list-head{display:flex;justify-content:space-between;align-items:end;padding:10px 14px 8px;border-top:1px solid #f0ebe7;border-bottom:1px solid #f0ebe7}
.list-title{font-size:15px;font-weight:900}.list-sub{font-size:11px;color:var(--muted);margin-top:3px}.sort{border:0;background:transparent;color:#6f6761;font-size:12px;font-weight:700}
.list{overflow-y:auto;padding:0 10px 12px}
.card{padding:13px 8px;border-bottom:1px solid #eee9e5;cursor:pointer;transition:.12s}
.card:hover{background:#faf7f5}.card.active{background:#f9eee8}
.card-head{display:flex;gap:8px;align-items:center}.name{font-size:15px;font-weight:900;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{margin-left:auto;border-radius:999px;padding:4px 7px;color:#fff;font-size:10px;font-weight:900}
.rating{margin-top:5px;color:#ae641f;font-size:13px;min-height:16px}.desc{margin-top:5px;color:#514b46;font-size:12.5px;line-height:1.5}
.meta{display:grid;gap:3px;margin-top:7px;color:#817871;font-size:11.5px;line-height:1.5}.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:12px}

/* map */
.map-wrap{position:relative;min-width:0;min-height:0;background:#eee}#map{width:100%;height:100%}
.map-status{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#f1efed;color:#776f68;font-size:13px;pointer-events:none}.map-status.hidden{display:none}
.map-hint{position:absolute;left:14px;bottom:14px;z-index:8;background:rgba(255,255,255,.93);border:1px solid #e4ddd7;border-radius:11px;padding:8px 10px;font-size:11px;color:#716963;box-shadow:0 4px 14px rgba(0,0,0,.08);pointer-events:none}

/* label markers */
.marker-label{display:flex;align-items:center;gap:6px;max-width:150px;height:30px;padding:0 9px 0 7px;background:#fff;border:2px solid var(--marker-color);border-radius:16px;box-shadow:0 3px 9px rgba(0,0,0,.28);white-space:nowrap;cursor:pointer;transform:translateY(-4px);transition:.12s}
.marker-label:hover{transform:translateY(-5px) scale(1.04);z-index:10}
.marker-label.selected{height:34px;padding:0 11px 0 8px;background:var(--marker-color);color:#fff;border-color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.34);transform:translateY(-6px) scale(1.06)}
.marker-dot{width:9px;height:9px;border-radius:50%;background:var(--marker-color);box-shadow:0 0 0 2px #fff;flex:0 0 auto}.marker-label.selected .marker-dot{background:#fff;box-shadow:none}
.marker-name{font-size:11px;font-weight:900;overflow:hidden;text-overflow:ellipsis}.marker-rating{font-size:10px;font-weight:900;color:#a96020;flex:0 0 auto}.marker-label.selected .marker-rating{color:#fff}
.kakao-info{position:relative;min-width:235px;max-width:310px;margin-bottom:18px;padding:13px 14px;border:1px solid #e2dad4;border-radius:14px;background:#fff;box-shadow:0 10px 26px rgba(28,21,17,.20)}
.popup-name{font-weight:900;font-size:15px;margin-bottom:4px}.popup-rating{color:#b06a2d;font-size:13px;margin-bottom:6px}.popup-line{color:#605852;font-size:12px;line-height:1.5;margin-top:3px}

.sheet-handle{display:none}

@media(max-width:800px){
  :root{--sidebar:100%;--header:106px}
  body{overflow:hidden}
  .app{height:100dvh;grid-template-rows:var(--header) 1fr}
  .topbar{grid-template-columns:1fr auto;grid-template-rows:54px 52px}
  .brand{border-right:0;padding:0 14px}
  .brand-title{font-size:19px;line-height:1.15}.brand-sub{font-size:12px;margin-top:3px}
  .top-filters{grid-column:1/3;grid-row:2;border-top:1px solid var(--line);padding:0 10px;gap:7px}
  .filter-btn{font-size:13px;padding:9px 13px;min-height:38px}
  .header-count{grid-column:2;grid-row:1;margin-right:12px;font-size:13px;padding:7px 10px}

  .main{position:relative;display:block;min-height:0;overflow:hidden}
  .map-wrap{position:absolute;inset:0;z-index:1}
  .map-hint{left:10px;bottom:128px;font-size:11px;padding:8px 10px}
  .map-status{font-size:14px}

  .sidebar{
    position:absolute;left:8px;right:8px;bottom:8px;z-index:25;
    height:min(58dvh,620px);min-height:0;border:1px solid var(--line);
    border-radius:20px 20px 16px 16px;box-shadow:0 -8px 28px rgba(30,24,20,.20);
    overflow:hidden;transition:transform .22s ease;
    transform:translateY(calc(100% - 132px));
    grid-template-rows:24px auto auto auto 1fr;
    background:rgba(255,255,255,.98);backdrop-filter:blur(10px);
  }
  .sidebar.sheet-mid{transform:translateY(42%)}
  .sidebar.sheet-full{transform:translateY(8px)}

  .sheet-handle{
    display:flex;align-items:center;justify-content:center;height:24px;cursor:grab;touch-action:none
  }
  .sheet-handle::before{content:"";width:44px;height:5px;border-radius:999px;background:#c8c0ba}
  .sheet-handle:active{cursor:grabbing}

  .search-wrap{padding:8px 12px 8px}
  .search{height:46px;border-radius:13px;font-size:16px;padding:0 14px}
  .quick-row{padding:0 12px 8px;gap:8px}
  .quick-btn{height:42px;font-size:14px;border-radius:12px}
  .list-head{padding:9px 12px 8px;align-items:center}
  .list-title{font-size:16px}.list-sub{font-size:12px}.sort{font-size:13px}
  .list{padding:0 8px 14px}
  .card{padding:14px 9px}
  .name{font-size:16px}.badge{font-size:11px;padding:5px 8px}
  .rating{font-size:14px;margin-top:6px}
  .desc{font-size:14px;line-height:1.5;margin-top:6px}
  .meta{font-size:12.5px;line-height:1.5;margin-top:8px;gap:4px}
  .empty{font-size:14px;padding:26px 12px}

  /* 모바일에서는 기본 마커를 작게 유지하고 선택 시에만 라벨을 펼친다 */
  .marker-label{
    width:28px;height:28px;max-width:28px;padding:0;border-radius:50%;
    justify-content:center;gap:0;transform:translateY(-3px);
    border-width:3px;box-shadow:0 3px 9px rgba(0,0,0,.32)
  }
  .marker-dot{width:10px;height:10px}
  .marker-name,.marker-rating{display:none}
  .marker-label.selected{
    width:auto;max-width:190px;height:38px;padding:0 12px 0 9px;border-radius:20px;
    gap:7px;transform:translateY(-6px) scale(1.03)
  }
  .marker-label.selected .marker-name,.marker-label.selected .marker-rating{display:inline}
  .marker-label.selected .marker-name{font-size:12px}
  .marker-label.selected .marker-rating{font-size:11px}
  .kakao-info{min-width:220px;max-width:78vw;padding:13px 14px}
  .popup-name{font-size:16px}.popup-rating{font-size:14px}.popup-line{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div><div class="brand-title">막냉이 합정 점심 뭐먹지 🍴</div><div class="brand-sub">합정·망원 점심 식당 지도</div></div>
    </div>
    <div id="filters" class="top-filters"></div>
    <div id="count" class="header-count">불러오는 중…</div>
  </header>

  <main class="main">
    <aside class="sidebar" id="sidebar">
      <div class="sheet-handle" id="sheetHandle" aria-label="식당 목록 열기/닫기"></div>
      <div class="search-wrap"><input id="search" class="search" type="search" placeholder="식당 이름 · 특징 · 주소 검색"></div>
      <div class="quick-row">
        <button id="myLocation" class="quick-btn">◎ 내 위치</button>
        <button id="showAll" class="quick-btn">⌂ 전체 보기</button>
      </div>
      <div class="list-head">
        <div><div class="list-title">식당 목록</div><div id="listSub" class="list-sub">지도에 표시된 식당</div></div>
        <select id="sort" class="sort"><option value="default">기본순</option><option value="rating">별점순</option><option value="name">이름순</option></select>
      </div>
      <div id="list" class="list"><div class="empty">식당 정보를 불러오는 중입니다.</div></div>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
      <div id="mapStatus" class="map-status">카카오 지도를 준비하는 중입니다.</div>
      <div class="map-hint">마커 또는 식당을 클릭하면 상세 정보가 열립니다.</div>
    </section>
  </main>
</div>

<script>
const KAKAO_KEY='c6656c45b7640edcf233a408bf0afa9a';
const COLORS={'한식':'#d97706','일식':'#2563eb','중식':'#dc2626','양식':'#7c3aed','아시아':'#059669','분식':'#db2777','카페':'#92400e','회식':'#475569'};
const ORDER=['전체','한식','일식','중식','양식','아시아','분식','카페','회식'];
const HOME_LAT=37.5515,HOME_LNG=126.9125;
let allData=[],activeCategory='전체',searchKeyword='',sortMode='default';
let map=null,mapReady=false,overlays=[],markerByRow=new Map(),infoOverlay=null,pendingRows=null,selectedRow=null,searchTimer=null;
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
const colorFor=c=>COLORS[c]||'#64748b';
const ratingScore=x=>(String(x.rating||'').match(/★/g)||[]).length;

function loadKakao(){return new Promise((resolve,reject)=>{if(window.kakao&&kakao.maps)return resolve();const s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_KEY+'&autoload=false';s.async=true;s.onload=()=>window.kakao&&kakao.maps?resolve():reject(new Error('SDK init failed'));s.onerror=()=>reject(new Error('SDK load failed'));document.head.appendChild(s);});}
function initMap(){loadKakao().then(()=>kakao.maps.load(()=>{map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(HOME_LAT,HOME_LNG),level:5});map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);infoOverlay=new kakao.maps.CustomOverlay({zIndex:30,yAnchor:1.12});mapReady=true;document.getElementById('mapStatus').classList.add('hidden');if(pendingRows){const r=pendingRows;pendingRows=null;renderMap(r,true);}})).catch(e=>{document.getElementById('mapStatus').textContent='카카오 지도 로딩 실패: '+e.message;});}

function markerHtml(x){
  const rating=ratingScore(x);
  return '<div class="marker-label" data-row="'+x.row+'" style="--marker-color:'+colorFor(x.category)+'">'+
    '<span class="marker-dot"></span>'+
    '<span class="marker-name">'+esc(x.name)+'</span>'+
    (rating?'<span class="marker-rating">★'+rating+'</span>':'')+
  '</div>';
}
function clearMarkers(){overlays.forEach(o=>o.overlay.setMap(null));overlays=[];markerByRow.clear();if(infoOverlay)infoOverlay.setMap(null);}
function popupHtml(x){return '<div class="kakao-info"><div class="popup-name">'+esc(x.name)+'</div><div class="popup-rating">'+esc(x.rating||'')+'</div>'+(x.feature?'<div class="popup-line"><b>특징</b> · '+esc(x.feature)+'</div>':'')+(x.capacity?'<div class="popup-line"><b>인원</b> · '+esc(x.capacity)+'</div>':'')+'<div class="popup-line"><b>주소</b> · '+esc(x.address)+'</div></div>';}
function selectRow(row,pan=true){
  selectedRow=row;
  document.querySelectorAll('.marker-label').forEach(el=>el.classList.toggle('selected',Number(el.dataset.row)===row));
  document.querySelectorAll('.card').forEach(el=>el.classList.toggle('active',Number(el.dataset.row)===row));
  const item=markerByRow.get(row);if(!item||!mapReady)return;
  if(pan){map.setLevel(3);map.panTo(item.position);}
  infoOverlay.setContent(popupHtml(item.data));infoOverlay.setPosition(item.position);infoOverlay.setMap(map);
  if(isMobile()&&pan)setSheetState('peek');
}
function renderMap(rows,fit=true){
  if(!mapReady){pendingRows=rows;return;}
  clearMarkers();selectedRow=null;if(!rows.length)return;
  const bounds=new kakao.maps.LatLngBounds();
  rows.forEach(x=>{
    const position=new kakao.maps.LatLng(Number(x.lat),Number(x.lng));
    const wrap=document.createElement('div');wrap.innerHTML=markerHtml(x);const content=wrap.firstElementChild;
    const overlay=new kakao.maps.CustomOverlay({map,position,content,xAnchor:.5,yAnchor:1,zIndex:5});
    const item={overlay,position,data:x,content};content.addEventListener('click',()=>selectRow(x.row,false));
    overlays.push(item);markerByRow.set(x.row,item);bounds.extend(position);
  });
  if(rows.length===1){map.setCenter(overlays[0].position);map.setLevel(3);}
  else if(fit)map.setBounds(bounds,46,46,46,46);
}
function buildFilters(){
  const cats=[...new Set(allData.map(x=>x.category).filter(Boolean))];
  const items=['전체',...cats].sort((a,b)=>(ORDER.indexOf(a)<0?99:ORDER.indexOf(a))-(ORDER.indexOf(b)<0?99:ORDER.indexOf(b)));
  const el=document.getElementById('filters');
  el.innerHTML=items.map(c=>'<button class="filter-btn '+(c===activeCategory?'active':'')+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.category;buildFilters();render(true);});
}
function getRows(){
  const q=searchKeyword.trim().toLowerCase();
  let rows=allData.filter(x=>(activeCategory==='전체'||x.category===activeCategory)&&(!q||[x.name,x.feature,x.address,x.capacity].join(' ').toLowerCase().includes(q)));
  if(sortMode==='rating')rows=[...rows].sort((a,b)=>ratingScore(b)-ratingScore(a)||a.name.localeCompare(b.name,'ko'));
  else if(sortMode==='name')rows=[...rows].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  return rows;
}
function renderList(rows){
  const el=document.getElementById('list');
  document.getElementById('listSub').textContent='현재 '+rows.length+'곳';
  if(!rows.length){el.innerHTML='<div class="empty">조건에 맞는 식당이 없습니다.</div>';return;}
  el.innerHTML=rows.map(x=>'<div class="card" data-row="'+x.row+'">'+
    '<div class="card-head"><div class="name">'+esc(x.name)+'</div><div class="badge" style="background:'+colorFor(x.category)+'">'+esc(x.category)+'</div></div>'+
    '<div class="rating">'+esc(x.rating||'')+'</div>'+
    (x.feature?'<div class="desc">'+esc(x.feature)+'</div>':'')+
    '<div class="meta">'+(x.capacity?'<div>👥 '+esc(x.capacity)+'</div>':'')+'<div>📍 '+esc(x.address)+'</div></div></div>').join('');
  el.querySelectorAll('.card').forEach(card=>card.onclick=()=>selectRow(Number(card.dataset.row),true));
}
function render(fit=true){const rows=getRows();document.getElementById('count').textContent=rows.length+'곳';renderList(rows);renderMap(rows,fit);}
function showAll(){activeCategory='전체';searchKeyword='';sortMode='default';document.getElementById('search').value='';document.getElementById('sort').value='default';buildFilters();render(true);if(isMobile())setSheetState('mid');}
function locateMe(){
  if(!navigator.geolocation){alert('현재 위치 기능을 사용할 수 없습니다.');return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    if(!mapReady)return;const p=new kakao.maps.LatLng(pos.coords.latitude,pos.coords.longitude);map.setCenter(p);map.setLevel(4);
  },()=>alert('현재 위치 권한을 허용하면 사용할 수 있습니다.'),{enableHighAccuracy:false,timeout:5000,maximumAge:300000});
}

const sidebar=document.getElementById('sidebar');
const sheetHandle=document.getElementById('sheetHandle');
let sheetState='peek',sheetStartY=null;

function isMobile(){return window.matchMedia('(max-width:800px)').matches;}
function setSheetState(state){
  if(!sidebar)return;
  sheetState=state;
  sidebar.classList.toggle('sheet-mid',state==='mid');
  sidebar.classList.toggle('sheet-full',state==='full');
}
function nextSheetState(){
  if(sheetState==='peek')setSheetState('mid');
  else if(sheetState==='mid')setSheetState('full');
  else setSheetState('peek');
}
if(sheetHandle){
  sheetHandle.addEventListener('click',()=>{if(isMobile())nextSheetState();});
  sheetHandle.addEventListener('pointerdown',e=>{if(!isMobile())return;sheetStartY=e.clientY;sheetHandle.setPointerCapture?.(e.pointerId);});
  sheetHandle.addEventListener('pointerup',e=>{
    if(!isMobile()||sheetStartY===null)return;
    const dy=e.clientY-sheetStartY;sheetStartY=null;
    if(Math.abs(dy)<24)return;
    if(dy<-35){if(sheetState==='peek')setSheetState('mid');else setSheetState('full');}
    else if(dy>35){if(sheetState==='full')setSheetState('mid');else setSheetState('peek');}
  });
}
window.addEventListener('resize',()=>{if(!isMobile())setSheetState('peek');});

document.getElementById('search').addEventListener('input',e=>{searchKeyword=e.target.value||'';clearTimeout(searchTimer);searchTimer=setTimeout(()=>render(true),120);});
document.getElementById('sort').addEventListener('change',e=>{sortMode=e.target.value;render(false);});
document.getElementById('showAll').onclick=showAll;
document.getElementById('myLocation').onclick=locateMe;

fetch('./restaurants.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('restaurants.json '+r.status);return r.json();})
  .then(p=>{allData=Array.isArray(p)?p:(Array.isArray(p.rows)?p.rows:[]);buildFilters();renderList(getRows());document.getElementById('count').textContent=allData.length+'곳';if(mapReady)renderMap(getRows(),true);})
  .catch(()=>{document.getElementById('list').innerHTML='<div class="empty">식당 데이터를 불러오지 못했습니다.</div>';document.getElementById('count').textContent='오류';});
setTimeout(initMap,0);
</script>
</body>
</html>
