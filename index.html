<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>막냉이 합정 점심 뭐먹지</title>
<link rel="preconnect" href="https://dapi.kakao.com" crossorigin>
<style>
:root{--bg:#f5f3ef;--panel:#fff;--text:#241f1b;--muted:#776f68;--line:#e8e2dc;--brand:#8e4c33;--brand-soft:#f3e9e4;--shadow:0 12px 30px rgba(46,35,28,.10);--radius:18px}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;color:var(--text);background:var(--bg)}body{overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px 12px;z-index:30}
.title-row{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:12px}.title{font-size:22px;font-weight:800}.subtitle{margin-top:3px;color:var(--muted);font-size:12px}
.count{color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filter-btn{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#514943;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
.filter-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.content{min-height:0;display:grid;grid-template-columns:minmax(300px,36%) 1fr;gap:14px;padding:14px}
.sidebar{min-height:0;display:grid;grid-template-rows:auto 1fr;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.search-wrap{padding:12px;border-bottom:1px solid var(--line)}.search{width:100%;border:1px solid var(--line);background:#faf8f6;border-radius:12px;padding:11px 12px;font-size:13px;outline:none}
.list{overflow-y:auto;padding:9px}.card{border:1px solid transparent;border-bottom-color:#eee9e5;border-radius:13px;padding:12px;cursor:pointer;background:#fff}
.card:hover{background:#faf6f3;border-color:#eadbd2}.card-head{display:flex;justify-content:space-between;gap:8px}.name{font-size:15px;font-weight:800}.badge{border-radius:999px;padding:4px 8px;color:#fff;font-size:10px;font-weight:800}
.rating{margin-top:5px;color:#b06a2d;font-size:12px;min-height:16px}.desc{margin-top:6px;color:#5f5751;font-size:12px;line-height:1.5}.meta{display:grid;gap:3px;margin-top:8px;color:#857c75;font-size:11px;line-height:1.4}
.map-panel{position:relative;min-height:0;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#e9e7e4}#map{width:100%;height:100%}
.map-status{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#eeeae6;color:#776f68;font-size:12px;pointer-events:none}.map-status.hidden{display:none}
.legend{position:absolute;right:12px;bottom:12px;z-index:10;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:10px;color:#665e58;box-shadow:0 5px 16px rgba(0,0,0,.10);pointer-events:none}
.legend-row{display:flex;align-items:center;gap:6px;margin:3px 0}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.kakao-info{position:relative;min-width:220px;max-width:310px;margin-bottom:14px;padding:12px 13px;border:1px solid #e5ddd7;border-radius:13px;background:#fff;box-shadow:0 8px 22px rgba(28,21,17,.18)}
.popup-name{font-weight:800;font-size:14px;margin-bottom:4px}.popup-rating{color:#b06a2d;font-size:12px;margin-bottom:6px}.popup-line{color:#605852;font-size:11px;line-height:1.5;margin-top:3px}
.empty{padding:24px;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100vh}.content{grid-template-columns:1fr;grid-template-rows:58vh auto}.map-panel{grid-row:1}.sidebar{grid-row:2;min-height:420px}.title{font-size:19px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="title-row"><div><div class="title">막냉이 합정 점심 뭐먹지 🍴</div><div class="subtitle">구분을 누르면 해당 식당만 지도에 표시됩니다.</div></div><div class="count" id="count">불러오는 중…</div></div>
  <div class="filters" id="filters"></div>
</header>
<main class="content">
  <section class="sidebar">
    <div class="search-wrap"><input id="search" class="search" type="search" placeholder="식당명 · 특징 · 주소 검색"></div>
    <div id="list" class="list"><div class="empty">식당 정보를 불러오는 중입니다.</div></div>
  </section>
  <section class="map-panel"><div id="map"></div><div id="mapStatus" class="map-status">카카오 지도를 준비하는 중입니다.</div><div id="legend" class="legend"></div></section>
</main>
</div>
<script>
const KAKAO_KEY='c6656c45b7640edcf233a408bf0afa9a';
const COLORS={'한식':'#d97706','일식':'#2563eb','중식':'#dc2626','양식':'#7c3aed','아시아':'#059669','분식':'#db2777','카페':'#92400e','회식':'#475569'};
const FALLBACK='#6b7280',HOME_LAT=37.5515,HOME_LNG=126.9125;
let allData=[],activeCategory='전체',searchKeyword='',map=null,mapReady=false,markers=[],markerByRow=new Map(),infoOverlay=null,searchTimer=null,pendingRows=null;
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
const colorFor=c=>COLORS[c]||FALLBACK;

function loadKakao(){return new Promise((resolve,reject)=>{if(window.kakao&&kakao.maps)return resolve();const s=document.createElement('script');s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_KEY+'&autoload=false';s.async=true;s.onload=()=>window.kakao&&kakao.maps?resolve():reject(new Error('Kakao SDK init failed'));s.onerror=()=>reject(new Error('Kakao SDK load failed'));document.head.appendChild(s);});}
function initMap(){loadKakao().then(()=>kakao.maps.load(()=>{map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(HOME_LAT,HOME_LNG),level:5});map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);infoOverlay=new kakao.maps.CustomOverlay({zIndex:20,yAnchor:1.15});mapReady=true;document.getElementById('mapStatus').classList.add('hidden');if(pendingRows){const r=pendingRows;pendingRows=null;renderMap(r);}})).catch(e=>{document.getElementById('mapStatus').textContent='카카오 지도 로딩 실패: '+e.message;});}
function markerImage(category){const color=colorFor(category),svg='<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><circle cx="11" cy="11" r="9" fill="'+color+'" stroke="#fff" stroke-width="3"/></svg>';return new kakao.maps.MarkerImage('data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),new kakao.maps.Size(22,22),{offset:new kakao.maps.Point(11,11)});}
function clearMarkers(){markers.forEach(m=>m.marker.setMap(null));markers=[];markerByRow.clear();if(infoOverlay)infoOverlay.setMap(null);}
function popupHtml(x){return '<div class="kakao-info"><div class="popup-name">'+esc(x.name)+'</div><div class="popup-rating">'+esc(x.rating||'')+'</div>'+(x.feature?'<div class="popup-line"><b>특징</b> · '+esc(x.feature)+'</div>':'')+(x.capacity?'<div class="popup-line"><b>인원</b> · '+esc(x.capacity)+'</div>':'')+'<div class="popup-line"><b>주소</b> · '+esc(x.address)+'</div>'+(x.note?'<div class="popup-line"><b>비고</b> · '+esc(x.note)+'</div>':'')+'</div>';}
function openInfo(item){if(!mapReady||!infoOverlay)return;infoOverlay.setContent(popupHtml(item.data));infoOverlay.setPosition(item.position);infoOverlay.setMap(map);}
function renderMap(rows){if(!mapReady){pendingRows=rows;return;}clearMarkers();if(!rows.length)return;const bounds=new kakao.maps.LatLngBounds();rows.forEach(x=>{const p=new kakao.maps.LatLng(Number(x.lat),Number(x.lng));const marker=new kakao.maps.Marker({map,position:p,image:markerImage(x.category),title:x.name,clickable:true});const item={marker,position:p,data:x};kakao.maps.event.addListener(marker,'click',()=>openInfo(item));markers.push(item);markerByRow.set(x.row,item);bounds.extend(p);});if(rows.length===1){map.setCenter(markers[0].position);map.setLevel(3);}else map.setBounds(bounds,35,35,35,35);}
function buildFilters(){const order=['전체','한식','일식','중식','양식','아시아','분식','카페','회식'];const cats=[...new Set(allData.map(x=>x.category).filter(Boolean))];const items=['전체',...cats].sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b)));const el=document.getElementById('filters');el.innerHTML=items.map(c=>'<button class="filter-btn '+(c===activeCategory?'active':'')+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.category;buildFilters();render();});}
function filtered(){const q=searchKeyword.trim().toLowerCase();return allData.filter(x=>(activeCategory==='전체'||x.category===activeCategory)&&(!q||[x.name,x.feature,x.address,x.note,x.locationHint,x.capacity].join(' ').toLowerCase().includes(q)));}
function renderList(rows){const el=document.getElementById('list');if(!rows.length){el.innerHTML='<div class="empty">조건에 맞는 식당이 없습니다.</div>';return;}el.innerHTML=rows.map(x=>'<div class="card" data-row="'+x.row+'"><div class="card-head"><div class="name">'+esc(x.name)+'</div><div class="badge" style="background:'+colorFor(x.category)+'">'+esc(x.category)+'</div></div><div class="rating">'+esc(x.rating||'')+'</div>'+(x.feature?'<div class="desc">'+esc(x.feature)+'</div>':'')+'<div class="meta">'+(x.capacity?'<div>👥 '+esc(x.capacity)+'</div>':'')+'<div>📍 '+esc(x.address)+'</div></div></div>').join('');el.querySelectorAll('.card').forEach(card=>card.onclick=()=>{const item=markerByRow.get(Number(card.dataset.row));if(!item||!mapReady)return;map.setLevel(3);map.panTo(item.position);openInfo(item);});}
function renderLegend(){const used=[...new Set(allData.map(x=>x.category).filter(Boolean))];document.getElementById('legend').innerHTML=used.map(c=>'<div class="legend-row"><span class="dot" style="background:'+colorFor(c)+'"></span><span>'+esc(c)+'</span></div>').join('');}
function render(){const rows=filtered();document.getElementById('count').textContent=rows.length+'곳';renderList(rows);renderMap(rows);}
document.getElementById('search').addEventListener('input',e=>{searchKeyword=e.target.value||'';clearTimeout(searchTimer);searchTimer=setTimeout(render,120);});
fetch('./restaurants.json',{cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error('restaurants.json '+r.status); return r.json(); })
  .then(p=>{
    allData=Array.isArray(p)?p:(Array.isArray(p.rows)?p.rows:[]);
    buildFilters(); renderLegend(); render();
  })
  .catch(e=>{
    document.getElementById('list').innerHTML='<div class="empty">식당 데이터를 불러오지 못했습니다.</div>';
    document.getElementById('count').textContent='오류';
  });
setTimeout(initMap,0);
</script>
</body>
</html>
